version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # mcp 2.x removed mcp.server.fastmcp; moving to it is a port, not a version bump.
      - dependency-name: "mcp"
        update-types: ["version-update:semver-major"]
