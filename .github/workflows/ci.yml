name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    # The wheel check below installs without the lockfile, as users do. Run it weekly so a
    # breaking upstream release is caught even when nothing is pushed.
    - cron: "17 6 * * 1"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Run tests
        run: uv run pytest

      - name: Build package
        run: uv build

      - name: Check clean wheel startup and protocol output
        run: |
          uv run --isolated --no-project --with ./dist/*.whl python - <<'PY'
          import contextlib
          import io
          output = io.StringIO()
          with contextlib.redirect_stdout(output):
              from paper_pilot.server import mcp
          assert not output.getvalue(), output.getvalue()
          print(mcp.name)
          PY

      - name: Check distributions
        run: uvx twine check dist/*
